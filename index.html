<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#0f172a"/>
<title>Gusukuma OS</title>
</head>
<body>
<script>
(async()=>{
const base = location.origin + location.pathname.replace(/\/[^/]*$/, '/');
const [p1,p2] = await Promise.all([
  fetch(base + 'p1.txt').then(r=>r.text()),
  fetch(base + 'p2.txt').then(r=>r.text())
]);
const bin = Uint8Array.from(atob(p1.trim()+p2.trim()), c=>c.charCodeAt(0));
const ds = new DecompressionStream('gzip');
const stream = new Response(bin).body.pipeThrough(ds);
const html = await new Response(stream).text();
document.open(); document.write(html); document.close();
})().catch(e=>{
  document.body.innerHTML = '<pre style="padding:20px;font-family:system-ui;background:#0f172a;color:#fff;min-height:100vh;margin:0">Gusukuma OS loading error:\n'+e+'\n\nTry refreshing.</pre>';
});
</script>
</body>
</html>
